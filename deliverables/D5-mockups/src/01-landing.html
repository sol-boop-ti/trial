<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poolday — Paste a link</title>
<link rel="stylesheet" href="app.css">
<style>
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 var(--pd-gutter) 40px; }
  h1 { margin: 0 0 44px; font-family: var(--pd-font-display); font-weight: 500; font-size: 68px; line-height: 1.02;
       letter-spacing: -0.045em; text-align: center; }
  h1 .a { background: var(--pd-grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .b { color: var(--pd-text-3); }
  h1 br { display: none; }

  .tabs { margin-bottom: 18px; }

  .field { position: relative; width: 760px; max-width: 100%; height: 72px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px 0 24px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
    border: 1px solid var(--pd-line-2); box-shadow: var(--pd-edge), 0 30px 80px -30px rgba(0,0,0,.9);
    transition: box-shadow var(--pd-dur-2) var(--pd-ease-out), border-color var(--pd-dur-2); }
  .field.focus { border-color: rgba(159,228,255,.42); box-shadow: var(--pd-edge), 0 0 0 4px rgba(159,228,255,.07), 0 0 60px -10px rgba(79,182,255,.35), 0 30px 80px -30px rgba(0,0,0,.9); }
  .field .ico { width: 20px; height: 20px; color: var(--pd-text-3); flex: none; }
  .field .input { flex: 1; min-width: 0; font-size: 19px; letter-spacing: -0.01em; color: var(--pd-text-1); white-space: nowrap; overflow: hidden; display: flex; align-items: center; }
  .field .ph { color: var(--pd-text-4); }
  .field .caret { display: inline-block; width: 1.5px; height: 24px; margin-left: 1px; background: var(--pd-light); box-shadow: 0 0 8px var(--pd-light); animation: blink 1.1s steps(1) infinite; }
  .field .ph + .caret { margin-left: 0; order: -1; margin-right: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .field .btn { height: 48px; padding: 0 20px 0 22px; }

  .imgslot { display: none; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 14px;
    border: 1px dashed var(--pd-line-3); color: var(--pd-text-2); font-size: 13.5px; white-space: nowrap; }
  .imgslot .thumb { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,.05); display: grid; place-items: center; color: var(--pd-text-3); }
  .field[data-tab="ad"] .imgslot { display: inline-flex; }
  .imgslot.filled { border-style: solid; border-color: var(--pd-line-2); background: rgba(255,255,255,.04); color: var(--pd-text-1); padding-right: 12px; }
  .imgslot.filled .thumb { background: radial-gradient(80% 80% at 50% 30%, #2a3140, #12151b); }
  .imgslot .x { color: var(--pd-text-3); margin-left: 2px; }

  .proof { margin-top: 28px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--pd-text-3); }
  .proof b { color: var(--pd-text-2); font-weight: 500; font-feature-settings: "tnum"; }
  .proof .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--pd-text-4); }

  @media (max-width: 640px) {
    :root { --horizon-top: 88vh; }
    .topbar { height: 60px; }
    .stage { justify-content: flex-start; padding-top: 196px; }
    h1 { font-size: 44px; line-height: 1.04; margin-bottom: 36px; letter-spacing: -0.045em; }
    h1 br { display: inline; }
    .tabs { width: 100%; margin-bottom: 12px; }
    .tab { flex: 1; justify-content: center; padding: 0 6px; font-size: 13px; }
    .tab svg { display: none; }
    .field { flex-wrap: wrap; height: auto; padding: 8px; border-radius: 22px; gap: 0; }
    .field .ico { margin: 0 10px 0 12px; }
    .field .input { height: 52px; font-size: 17px; }
    .field .btn { width: 100%; height: 52px; font-size: 15px; }
    .field[data-tab="ad"] .imgslot { width: 100%; margin: 0 0 8px; }
    .proof { margin-top: 22px; font-size: 12.5px; flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="horizon"></div><div class="grain"></div>

  <header class="topbar">
    <a class="wordmark" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="wmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaff"/><stop offset="1" stop-color="#4fb6ff"/></linearGradient><clipPath id="wmc"><circle cx="12" cy="12" r="9.25"/></clipPath></defs><circle cx="12" cy="12" r="9.25" fill="none" stroke="#f3f4f6" stroke-width="1.5"/><rect x="0" y="13.4" width="24" height="12" fill="url(#wmg)" clip-path="url(#wmc)"/></svg>poolday</a>
  </header>

  <main class="stage">
    <h1><span class="a">Paste a link.</span><br> <span class="b">Watch the video.</span></h1>

    <div class="tabs" id="tabs">
      <div class="tab-ind" id="ind"></div>
      <button class="tab on" data-tab="launch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="3.25" width="12.5" height="9.5" rx="2.25"/><path d="M6.75 6.1v3.8L10 8z" fill="currentColor"/></svg>Launch video</button>
      <button class="tab" data-tab="podcast"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="5.75" y="1.75" width="4.5" height="8" rx="2.25"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.25"/></svg>Podcast clips</button>
      <button class="tab" data-tab="ad"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.75l1.6 3.9 3.9 1.6-3.9 1.6L8 12.75l-1.6-3.9-3.9-1.6 3.9-1.6z"/><path d="M12.5 11.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="currentColor" stroke="none"/></svg>AI product ad</button>
    </div>

    <div class="field" id="field" data-tab="launch">
      <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8.5 11.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.54 3.54 0 0 0-5-5l-.9.9"/><path d="M11.5 8.5a3.5 3.5 0 0 0-5 0L4 11a3.54 3.54 0 0 0 5 5l.9-.9"/></svg>
      <div class="input" id="input"><span class="ph" id="ph">yourcompany.com</span><span class="caret"></span></div>
      <div class="imgslot"><span class="thumb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></span>Product image</div>
      <button class="btn btn-primary" id="go"><span id="golabel">Make video</span><svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
    </div>

    <div class="proof"><span class="live-dot"></span><span><b id="count">1,284</b> videos made today</span><span class="sep"></span><span>Free, no sign-up</span></div>
  </main>
</div>

<script>
const TABS = {
  launch:  { ph: "yourcompany.com", go: "Make video" },
  podcast: { ph: "Paste a YouTube or podcast link", go: "Find clips" },
  ad:      { ph: "yourproduct.com", go: "Make ad" },
};
const $ = (s) => document.querySelector(s);
function placeInd() {
  const on = document.querySelector(".tab.on"), tabs = $("#tabs");
  const r = on.getBoundingClientRect(), p = tabs.getBoundingClientRect();
  $("#ind").style.left = (r.left - p.left - 1) + "px"; $("#ind").style.width = r.width + "px";
}
function setTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  $("#field").dataset.tab = name; const ph = $("#ph"); if (ph) ph.textContent = TABS[name].ph; $("#golabel").textContent = TABS[name].go;
  placeInd();
}
function setValue(v, focus = true) {
  const input = $("#input");
  input.innerHTML = v ? `<span>${v}</span><span class="caret"></span>` : `<span class="ph" id="ph">${TABS[$("#field").dataset.tab].ph}</span><span class="caret"></span>`;
  $("#field").classList.toggle("focus", focus);
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
function indBetween(a, b, k) {
  const tabs = $("#tabs").getBoundingClientRect();
  const ra = document.querySelector(`.tab[data-tab=${a}]`).getBoundingClientRect(), rb = document.querySelector(`.tab[data-tab=${b}]`).getBoundingClientRect();
  $("#ind").style.left = (ra.left + (rb.left - ra.left) * k - tabs.left - 1) + "px"; $("#ind").style.width = (ra.width + (rb.width - ra.width) * k) + "px";
}
window.demo = { setTab, setValue, indBetween,
  hover(on) { $("#go").classList.toggle("is-hover", on); },
  press(on) { $("#go").classList.toggle("is-press", on); },
  rect(sel) { const r = document.querySelector(sel).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; } };
const q = new URLSearchParams(location.search);
if (q.get("img")) { const sl = document.querySelector(".imgslot"); sl.classList.add("filled");
  sl.innerHTML = `<span class="thumb"><svg width="22" height="28" viewBox="0 0 22 28"><defs><linearGradient id="bt" x1="0" x2="1"><stop offset="0" stop-color="#9aa4b4"/><stop offset=".45" stop-color="#eef2f7"/><stop offset="1" stop-color="#6d7686"/></linearGradient></defs><rect x="8" y="1" width="6" height="4" rx="1" fill="#c6f432"/><path d="M7 5h8v3c3 1.2 4 3 4 5.5V25a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V13.5C3 11 4 9.2 7 8z" fill="url(#bt)"/><rect x="5" y="15" width="12" height="6" rx="1" fill="#0e1116" opacity=".85"/></svg></span>lumen.png<svg class="x" width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>`; }
document.fonts.ready.then(() => { setTab(q.get("tab") || "launch"); setValue(q.get("v") || "", q.has("focus") || !!q.get("v")); document.body.dataset.ready = 1; });
</script>
</body>
</html>

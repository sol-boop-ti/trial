<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Keynote preview</title>
<link rel="stylesheet" href="preview.css">
<style>
  /* Northwind (fictional customer) palette: ink, lime, cream. Customer colours live in media only. */
  .stage { background: #06070a; }
  .wall { position: absolute; inset: -80px; opacity: .5; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .grad-t { background: linear-gradient(180deg, #ffffff 10%, #aab1bc 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* --- Scene A: liquid glass --- */
  #hA { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-family: "NW Display"; font-weight: 500; font-size: 138px; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
  #hA span { display: inline-block; padding: 0 .12em 0.1em; margin: 0 -.09em; }
  .glass { position: absolute; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,255,255,.14), inset 0 0 40px rgba(255,255,255,.05), 0 40px 80px -30px rgba(0,0,0,.7); }
  .spec { position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a, 200deg), rgba(255,255,255,.95), rgba(255,255,255,0) 22%, rgba(255,255,255,0) 48%, rgba(255,255,255,.55) 56%, rgba(255,255,255,0) 70%, rgba(255,255,255,.95));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(60% 90% at var(--sx, 30%) 0%, rgba(255,255,255,.22), transparent 60%); }
  #pill { left: 360px; top: 190px; width: 560px; height: 168px; border-radius: 84px; }
  #pillIn { position: absolute; inset: 0; display: flex; align-items: center; gap: 22px; padding: 0 44px; }
  #pillIn .ic { width: 84px; height: 84px; border-radius: 26px; background: #0e1116; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.15); flex: none; }
  #pillIn b { display: block; font-family: "NW Display"; font-weight: 600; font-size: 36px; letter-spacing: -0.03em; color: #fff; }
  #pillIn span { font-size: 22px; color: rgba(255,255,255,.7); }
  #pillIn .live { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; background: #c6f432; box-shadow: 0 0 18px #c6f432; }

  /* --- Scene B: floating cards --- */
  #cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
  .card { position: absolute; border-radius: 30px; padding: 26px 30px; }
  .card .k { font-family: "NW Mono"; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .card .v { font-family: "NW Display"; font-weight: 500; font-size: 78px; letter-spacing: -0.045em; line-height: 1.05; color: #fff; margin-top: 8px; }
  .card .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(198,244,50,.16); color: #dcff7a; font-size: 18px; font-weight: 600; margin-top: 10px; }
  #cB2 svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 190px; }
  #cB3 { display: flex; align-items: center; gap: 16px; padding: 0 24px; }
  #cB3 .ic { width: 48px; height: 48px; border-radius: 14px; background: #0e1116; display: grid; place-items: center; flex: none; }
  #cB3 b { display: block; font-size: 20px; font-weight: 600; color: #fff; } #cB3 span { font-size: 16px; color: rgba(255,255,255,.6); }
  #cB4 .row { display: flex; gap: 10px; margin-top: 16px; } #cB4 .row i { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #c9d2df, #6b7686); border: 3px solid rgba(255,255,255,.3); }

  /* --- Scene C: device reveal --- */
  #sC { background: radial-gradient(60% 55% at 50% 100%, #1c2a14 0%, #0a0d0a 55%, #06070a 100%); perspective: 1600px; }
  #floor { position: absolute; left: 190px; top: 560px; width: 900px; height: 220px; border-radius: 50%; background: radial-gradient(50% 50% at 50% 50%, rgba(198,244,50,.28), transparent 70%); filter: blur(24px); }
  #dev { position: absolute; left: 244px; top: 150px; width: 792px; transform-origin: 50% 100%; transform-style: preserve-3d; }
  #scr { position: relative; width: 792px; height: 488px; border-radius: 26px; background: #0b0d10; padding: 16px; box-shadow: 0 0 0 2px #2a2e35, inset 0 0 0 1px rgba(255,255,255,.08), 0 60px 120px -40px rgba(0,0,0,.9); overflow: hidden; }
  #scr svg { width: 100%; height: 100%; display: block; border-radius: 10px; }
  #scr .band { position: absolute; inset: -40% -20%; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.10) 48%, rgba(255,255,255,.02) 52%, transparent 58%); }
  #base { width: 900px; height: 22px; margin-left: -54px; border-radius: 0 0 26px 26px; background: linear-gradient(180deg, #3a3f47, #1a1d22 60%, #0c0e11); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset; }
  #hC { position: absolute; left: 0; right: 0; top: 58px; text-align: center; font-family: "NW Display"; font-weight: 500; font-size: 52px; letter-spacing: -0.035em; white-space: nowrap; }
  #hC span { display: inline-block; padding: 0 .1em .08em; margin: 0 -.06em; }

  /* --- Scene D: close-up + end card --- */
  #sD { background: #05060a; }
  #macro { position: absolute; inset: 0; transform-origin: 70% 60%; }
  #macro .gridl { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 120px 120px; filter: blur(1.5px); }
  #num { position: absolute; left: 96px; top: 150px; font-family: "NW Display"; font-weight: 500; font-size: 210px; letter-spacing: -0.055em; line-height: 1; font-feature-settings: "tnum"; }
  #numK { position: absolute; left: 106px; top: 116px; font-family: "NW Mono"; font-size: 18px; letter-spacing: .12em; color: rgba(255,255,255,.6); }
  #end { position: absolute; inset: 0; background: #06070a; display: grid; place-items: center; }
  #lock { display: flex; align-items: center; gap: 22px; font-family: "NW Display"; font-weight: 600; font-size: 76px; letter-spacing: -0.045em; color: #f4f1ea; }
  #lock .m { width: 74px; height: 74px; border-radius: 20px; background: #0e1116; border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; }
  #endSub { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-size: 22px; color: #8a93a3; letter-spacing: -0.01em; }
  #fade { position: absolute; inset: 0; background: #06070a; z-index: 40; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div id="defs"></div>
  <!-- A: liquid glass sweeps across the headline, refracting it, then settles as a live pill -->
  <section class="scene" id="sA">
    <div class="wall" id="wallA"><i class="blob" style="left:40px;top:420px;width:760px;height:560px;background:#9cc820"></i><i class="blob" style="left:760px;top:40px;width:640px;height:520px;background:#138f86"></i><i class="blob" style="left:900px;top:520px;width:600px;height:420px;background:#2441e0"></i></div>
    <div id="hA"></div>
    <div class="glass" id="pill"><div class="sheen"></div><div id="pillIn"><span class="ic"><svg width="44" height="44" viewBox="0 0 10 10"><use href="#nwMark"/></svg></span><div><b>Forecast updated</b><span>Q3 · 94% confidence</span></div><i class="live"></i></div><div class="spec"></div></div>
  </section>
  <!-- B: floating glass cards with depth of field -->
  <section class="scene" id="sB">
    <div id="cam">
      <div class="wall" id="wallB"><i class="blob" style="left:-60px;top:380px;width:700px;height:520px;background:#7fa819"></i><i class="blob" style="left:700px;top:-40px;width:720px;height:520px;background:#0f7a74"></i><i class="blob" style="left:840px;top:520px;width:700px;height:420px;background:#1f36c4"></i></div>
      <div class="glass card" id="cB3" style="left:118px;top:92px;width:360px;height:96px"><span class="ic"><svg width="26" height="26" viewBox="0 0 10 10"><use href="#nwMark"/></svg></span><div><b>Forecast updated</b><span>just now · 14 sources</span></div><div class="spec"></div></div>
      <div class="glass card" id="cB2" style="left:606px;top:118px;width:520px;height:320px"><div class="k">Revenue vs. forecast</div><div class="v" style="font-size:44px;margin-top:6px">Q3 · on track</div>
        <svg viewBox="0 0 520 190" preserveAspectRatio="none"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f432" stop-opacity=".35"/><stop offset="1" stop-color="#c6f432" stop-opacity="0"/></linearGradient></defs>
          <path id="bArea" d="M0 170 C60 160 90 150 140 138 S230 120 270 104 S360 70 400 60 S480 30 520 22 V190 H0Z" fill="url(#gB)"/><path id="bLine" d="M0 170 C60 160 90 150 140 138 S230 120 270 104 S360 70 400 60 S480 30 520 22" fill="none" stroke="#c6f432" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></svg><div class="spec"></div></div>
      <div class="glass card" id="cB1" style="left:196px;top:262px;width:430px;height:250px"><div class="k">Revenue · Q3</div><div class="v" id="bNum">$4.82M</div><span class="chip">▲ 18.4%</span><div class="spec"></div></div>
      <div class="glass card" id="cB4" style="left:820px;top:470px;width:420px;height:230px"><div class="k">Scenario B</div><div class="v" style="font-size:48px">Hire 4 in Q4</div><div class="row"><i></i><i></i><i></i></div><div class="spec"></div></div>
    </div>
  </section>
  <!-- C: device reveal -->
  <section class="scene" id="sC">
    <div id="floor"></div>
    <div id="hC"></div>
    <div id="dev"><div id="scr"><svg viewBox="0 0 1200 720"><use href="#nwDash"/></svg><div class="band" id="band"></div></div><div id="base"></div></div>
  </section>
  <!-- D: product close-up, then the end card -->
  <section class="scene" id="sD">
    <div id="macro">
      <div class="gridl"></div>
      <svg id="mChart" viewBox="0 0 1280 720" style="position:absolute;inset:0;width:100%;height:100%">
        <defs><linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f432" stop-opacity=".32"/><stop offset="1" stop-color="#c6f432" stop-opacity="0"/></linearGradient>
          <filter id="glw" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter></defs>
        <path d="M-40 640 C160 610 300 600 420 560 S640 470 760 430 S980 300 1100 250 S1260 180 1340 150 V760 H-40Z" fill="url(#gD)"/>
        <path d="M-40 640 C160 610 300 600 420 560 S640 470 760 430 S980 300 1100 250 S1260 180 1340 150" fill="none" stroke="#c6f432" stroke-width="16" opacity=".55" filter="url(#glw)"/>
        <path id="dLine" d="M-40 640 C160 610 300 600 420 560 S640 470 760 430 S980 300 1100 250 S1260 180 1340 150" fill="none" stroke="#e4ff8a" stroke-width="6" stroke-linecap="round"/>
        <circle id="dDot" cx="1100" cy="250" r="13" fill="#f4ffd6"/><circle id="dRing" cx="1100" cy="250" r="13" fill="none" stroke="#c6f432" stroke-width="3"/>
      </svg>
      <div id="numK">FORECAST ACCURACY · Q3</div>
      <div id="num" class="grad-t">+18.4%</div>
    </div>
    <div id="end"><div id="lock"><span class="m"><svg width="40" height="40" viewBox="0 0 10 10"><use href="#nwMark"/></svg></span><span>northwind</span></div><div id="endSub">Forecast. Available today.</div></div>
  </section>
  <div id="fade"></div>
  <div class="vig"></div>
</div>
<script src="../lib/motion.js"></script>
<script src="preview.js"></script>
<script>
const { clamp, lerp, seg, fr, expo, ink, out3, out5, inOut3, in3, spring, smooth, breathe } = M;
const $ = (s) => document.querySelector(s);
const words = (el, text) => { el.innerHTML = text.split(" ").map(w => `<span class="grad-t">${w}</span>`).join(" "); return [...el.children]; };
let WA, WC;
const scenes = [["sA", 0, 3], ["sB", 3, 6], ["sC", 6, 9], ["sD", 9, 12]];
function wordRise(ws, t, t0, stagger, A) { ws.forEach((w, i) => { const tau = fr(t, t0 + i * stagger / 30);
  w.style.transform = `translateY(${(1 - expo(tau)) * A}px)`; w.style.opacity = ink(tau); w.style.filter = tau < 6 ? `blur(${(1 - expo(tau)) * 10}px)` : ""; }); }

function draw(t) {
  scenes.forEach(([id, a, b]) => $("#" + id).classList.toggle("on", t >= a && t < b));
  // fade-from-ground at loop start, fade-to-ground at loop end: seamless loop
  $("#fade").style.opacity = t < 0.2 ? 1 - out3(t / 0.2) : t > 11.8 ? seg(t, 11.8, 12) : 0;

  if (t < 3) { // ---------------------------------------------------------- A
    const drift = t * 10;
    [...$("#wallA").children].forEach((b, i) => b.style.transform = `translate(${Math.sin(t * .7 + i * 2) * 30 - drift * (i - 1)}px, ${Math.cos(t * .6 + i) * 24}px)`);
    wordRise(WA, t, 0.12, 4, 70);
    $("#hA").style.transform = `scale(${1 + t * 0.012})`; // alive hold: slow push
    // Glass sweeps in from the right across the headline, decelerating over the words (refraction reads),
    // then drops below and settles with a small overshoot, content inking in.
    const sw = seg(t, 0.55, 1.5), x = lerp(330, -30, out3(sw)) - (t > 1.5 ? (t - 1.5) * 8 : 0);
    const dropTau = fr(t, 1.42), y = lerp(0, 238, spring(dropTau, 0.3, 0.22));
        // Move by left/top, not transform: the backdrop displacement map must stay in the element's own space.
    $("#pill").style.opacity = ink(fr(t, 0.55), 0.3); // materialises in frame (never clipped by the frame edge)
    $("#pill").style.left = (360 + x) + "px"; $("#pill").style.top = (190 + y) + "px";
    $("#pill .spec").style.setProperty("--a", (190 + x * 0.12 + t * 12) + "deg");
    $("#pill .sheen").style.setProperty("--sx", (30 + x * 0.04) + "%");
    const cIn = fr(t, 1.7); $("#pillIn").style.opacity = ink(cIn, 0.4); $("#pillIn").style.transform = `translateY(${(1 - expo(cIn)) * 14}px)`;
    $("#pillIn .live").style.boxShadow = `0 0 ${14 + Math.sin(t * 6) * 6}px #c6f432`;
    if (t > 2.72) { const k = in3(seg(t, 2.72, 3)); $("#sA").style.transform = `translateY(${-k * 60}px) scale(${1 + k * 0.03})`; } else $("#sA").style.transform = "";
  } else if (t < 6) { // --------------------------------------------------- B
    const u = t - 3;
    $("#cam").style.transform = `scale(${1 + u * 0.014}) translateX(${-u * 6}px)`;
    [...$("#wallB").children].forEach((b, i) => b.style.transform = `translate(${Math.sin(u * .6 + i) * 30}px, ${Math.cos(u * .5 + i * 2) * 20}px)`);
    // depth: [id, birth order, depth (1 near .. 0 far), blur px, parallax px/s]
    const C = [["#cB3", 0, .2, 3.2, 26], ["#cB2", 1, .55, 0, 16], ["#cB1", 2, .8, 0, 8], ["#cB4", 3, 1.25, 9, -34]];
    C.forEach(([s, k, z, bl, px]) => { const tau = fr(u, 0.08 + k * 5 / 30); const e = spring(tau, 0.3, 0.2);
      const rot = (1 - expo(tau, 0.82)) * 5 * (k % 2 ? -1 : 1) + (k % 2 ? 0.6 : -0.6) * expo(tau);
      $(s).style.transform = `translate(${u * px}px, ${(1 - e) * 170}px) rotate(${rot}deg) scale(${0.9 + 0.1 * e})`;
      $(s).style.opacity = ink(tau, 0.45); $(s).style.filter = bl ? `blur(${bl}px)` : ""; });
    const lk = out3(seg(u, 0.5, 1.6)); $("#bLine").style.strokeDashoffset = 1 - lk; $("#bArea").style.opacity = lk;
    const n = 4.82 * out5(seg(u, 0.35, 1.3)); $("#bNum").textContent = "$" + n.toFixed(2) + "M";
    if (u > 2.75) { const k = in3(seg(u, 2.75, 3)); $("#cam").style.transform += ` translateX(${-k * 90}px)`; }
  } else if (t < 9) { // --------------------------------------------------- C
    const u = t - 6;
    // size lands fast (out5), rotation keeps turning longer (out3): manual section 4
    const r = out3(seg(u, 0.05, 1.35)), s = out5(seg(u, 0.05, 0.95));
    const push = 1 + Math.max(0, u - 1.3) * 0.012;
    $("#dev").style.transform = `translateY(${(1 - s) * 300}px) rotateX(${lerp(58, 6, r) - Math.max(0, u - 1.35) * 1.2}deg) scale(${(0.84 + 0.16 * s) * push})`;
    $("#floor").style.opacity = 0.2 + 0.8 * s;
    $("#band").style.transform = `translateX(${lerp(-70, 70, inOut3(seg(u, 0.9, 2.3)))}%)`;
    wordRise(WC, t, 7.2, 4, 40);
  } else { // ------------------------------------------------------------- D
    const u = t - 9;
    $("#macro").style.transform = `scale(${1.02 + u * 0.03}) rotate(${-1.6 + u * 0.35}deg)`;
    const n = 18.4 * out5(seg(u, 0.1, 0.9)); $("#num").textContent = "+" + n.toFixed(1) + "%";
    const nt = fr(u, 0.05); $("#num").style.opacity = ink(nt); $("#num").style.transform = `translateY(${(1 - expo(nt)) * 60}px)`;
    $("#numK").style.opacity = ink(fr(u, 0.3));
    const pr = 13 + (u * 30 % 30) * 1.3; $("#dRing").setAttribute("r", pr); $("#dRing").style.opacity = 1 - (u * 30 % 30) / 30;
    const e = seg(u, 1.9, 3);
    $("#end").style.visibility = u >= 1.9 ? "visible" : "hidden";
    const lt = fr(u, 1.93); const ls = lerp(0.82, 1, out3(Math.min(1, lt / 14))) + Math.max(0, lt - 14) * 0.0008;
    $("#lock").style.transform = `scale(${ls})`; $("#lock").style.opacity = ink(lt, 0.5);
    const st = fr(u, 1.93 + 8 / 30); $("#endSub").style.opacity = ink(st, 0.4) * 0.9; $("#endSub").style.transform = `translateY(${(1 - expo(st)) * 16}px)`;
  }
}
Preview({ loop: 12, init: async () => {
  $("#defs").innerHTML = await (await fetch("../frames.svg")).text();
  WA = words($("#hA"), "See what’s next."); WC = words($("#hC"), "The forecast that updates itself.");
  liquidGlass($("#pill"), { radius: 84, bezel: 70, scale: 56, mag: 0.35, blur: 0.9 });
  ["#cB1", "#cB2", "#cB3", "#cB4"].forEach(s => { const el = $(s); el.style.backdropFilter = "blur(22px) saturate(1.6) brightness(1.08)"; });
}, draw });
</script>
</body>
</html>

<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poolday</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .ink { fill:var(--ink); }
  .cta { fill:var(--cta); }
  .cyan { fill:var(--brand-cyan); }
  .glass { fill:var(--surface-glass); }
  .quiet { fill:var(--ink-quiet); }
  .tile { rx:var(--radius-card); }
  .pill { rx:calc(var(--control-md) / 2); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.9; font-weight:500; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 186x112 (the two-wide lead video tile) · brand-cyan 88x112 · surface-glass 88x112 · ink-quiet 100x112 bleeding off the right edge · cta pill 186x40 above — ~30% of 960x288
  arrangement the video grid itself: one tile spanning two columns then single columns, gap-grid gutters, bottoms space-6 above the edge, the CTA pill floating over the grid as on the page
  pattern     scan-dots, from "dots every 4px on rows every 8px, swelling toward the centre": 43 short bars on space-4 rows whose height swells toward an ellipse centre
  scales      columns grid-column-width scaled (88) with gap-grid 10; corners radius-card; pill rx = control-md / 2; rows space-4
-->

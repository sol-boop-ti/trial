<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poolday brand kit — components</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<style>.sec{padding:48px;}.lbl{font:13px/18px var(--font-sans);color:var(--ink-muted);margin:0 0 16px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Poolday, h = React.createElement;
  function Sec(label, child) { return h('section', { className: 'sec' }, h('p', { className: 'lbl' }, label), child); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(P.NavBar), h(P.Hero, { animate: true }),
    Sec('SectionTitle + FilterTabs', h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24 } },
      h(P.SectionTitle, { lead: '100M+ video edits made by Poolday.', tail: 'Some examples here.' }), h(P.FilterTabs))),
    Sec('VideoGrid', h(P.VideoGrid, null,
      h(P.VideoCard, { span: 2, title: 'Marblism – Product Launch', tag: 'Tech', recipe: 'Brand kit + single prompt', tint: '#262626' }),
      h(P.VideoCard, { title: 'Lovable – Instagram Ad', tag: 'Tech', recipe: 'Founder photo + voice clone', tint: '#1a1a1a' }),
      h(P.VideoCard, { title: 'Smart Reframe', tag: 'Podcasts', recipe: '16:9 and 9:16', tint: '#202020' }),
      h(P.VideoCard, { title: 'Dust – Agent demo', tag: 'Tech', recipe: 'Screen recording to video', tint: '#171717' }))),
    Sec('Buttons', h('div', { style: { display: 'flex', gap: 24, alignItems: 'center' } }, h(P.Button, { size: 'lg' }, 'Book a 15 min demo'), h(P.Button, { size: 'md' }, 'Book a 15 min demo')))
  ));
</script>
</body>
</html>
